
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Love Quiz 💗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="floating-hearts" id="hearts"></div>

  <main class="quiz-card">
    <p class="tag">A LITTLE GAME FOR TWO ♡</p>
    <h1>The Love Quiz</h1>
    <p class="subtitle">Hansika & Shriraj Edition</p>

    <div id="start-screen">
      <div class="big-heart">💗</div>
      <h2>How well do you know her?</h2>
      <p>10 questions, little memories and lots of love!</p>
      <button onclick="startQuiz()">Let's Play ♡</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <p id="question-number"></p>
      <div class="progress">
        <div id="progress-bar"></div>
      </div>
      <h2 id="question"></h2>
      <div id="answers"></div>
      <p id="feedback"></p>
      <button id="next-button" class="hidden" onclick="nextQuestion()">Next ♡</button>
    </div>

    <div id="result-screen" class="hidden">
      <div class="big-heart">💕</div>
      <h2>Quiz completed!</h2>
      <p id="final-score"></p>
      <p id="final-message"></p>
      <button onclick="restartQuiz()">Play Again ♡</button>
    </div>

    <p class="footer">made with love, just for you ♡</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
